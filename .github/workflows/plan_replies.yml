name: Plan Daily X Replies

on:
  schedule:
    # 06:10 JST = 21:10 UTC（前日）
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: リプライ計画の生成
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python plan_replies.py

      - name: 計画ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/reply_plan_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reply plan for $(TZ=Asia/Tokyo date +%Y%m%d)"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          else
            echo "No plan file changes to commit."
          fi
