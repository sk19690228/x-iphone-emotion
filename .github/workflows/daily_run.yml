name: Daily Reply Plan Generation

on:
  schedule:
    # UTC 20:30 = JST 05:30 (日本時間毎朝5:30)
    - cron: '30 20 * * *'
  workflow_dispatch: # 手動実行用ボタンを追加

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          pip install -r requirements.txt

      - name: スクリプトの実行
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python scripts/plan_replies.py

      - name: リプライ計画をリポジトリに自動保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          git add results/
          git commit -m "Auto: Save daily reply plan [skip ci]" || exit 0
          git push
