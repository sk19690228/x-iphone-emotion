name: Daily iPhone Emotion Search

on:
  schedule:
    # UTC 21:00 = JST 06:00 (日本時間毎朝6:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行用ボタンを追加

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python scripts/plan_replies.py
          pip install -r requirements.txt

      - name: スクリプトの実行
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 抽出結果（JSON）をリポジトリに自動保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Auto: Save daily emotion search results [skip ci]" || exit 0
          git push
