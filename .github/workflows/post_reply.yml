name: Post Scheduled X Reply

on:
  schedule:
    # JST 06:00-21:00 の間、15分おきにチェック（UTC 21:00-翌12:00）
    - cron: '*/15 21-23,0-12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-x-reply
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: リプライ投稿チェック
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python post_reply.py

      - name: 更新した計画ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/reply_plan_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update reply plan status"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          else
            echo "No plan file changes to commit."
          fi
