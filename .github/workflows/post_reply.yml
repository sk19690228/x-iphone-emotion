name: Post Scheduled X Reply

on:
  # 自動投稿は停止し、webapp/ の手動投稿アプリから投稿する運用に変更。
  # 必要な場合のみ Actions タブから手動実行できるように workflow_dispatch は残す。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-x-reply
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: リプライ投稿チェック
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_reply.py

      - name: 更新した計画ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "Update reply plan status"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          else
            echo "No plan file changes to commit."
          fi
